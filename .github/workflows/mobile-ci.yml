name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript
        id: typescript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-output.txt
      - name: Fail on TypeScript errors
        if: steps.typescript.outputs.exit_code != '0'
        run: exit 1
      - name: Expo Doctor
        run: npx expo-doctor
